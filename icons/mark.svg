<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Remento">
  <!-- The mark is the app's own vocabulary: a scarlet block, a serif R, and
       the index rule that runs under every screen in the product. -->
  <rect width="64" height="64" rx="12" fill="#EF3B42"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="38" fill="#F0EEE9">R</text>
  <rect x="18" y="50" width="28" height="2" rx="1" fill="#F0EEE9" opacity=".55"/>
</svg>
