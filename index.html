<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="description" content="Spaced-repetition flashcards for coursework.">
<meta property="og:title" content="Remento">
<meta property="og:description" content="Spaced-repetition flashcards for coursework.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<meta name="twitter:card" content="summary">
<title>Remento</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/mark.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Three families, two superfamilies. Plex Sans carries the interface,
     Plex Mono the technical layer, Newsreader the study surface. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<!-- KaTeX stylesheet. The renderer is imported as an ES module in js/ui.js. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0/dist/katex.min.css">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ── boot ──────────────────────────────────────────────────────────────── -->
<div id="boot" class="boot">
  <img class="boot-mark" src="icons/mark.svg" alt="" width="44" height="44">
  <div class="spinner" role="status" aria-label="Loading Remento"></div>
</div>

<!-- ── sign in ───────────────────────────────────────────────────────────── -->
<!-- The whole app is behind this. No session, nothing else renders. -->
<main id="signin" class="signin" hidden>
  <div class="signin-panel">
    <img class="signin-mark" src="icons/mark.svg" alt="" width="40" height="40">
    <h1 class="signin-title">Remento</h1>
    <p class="signin-sub">Spaced repetition for coursework.</p>

    <form id="signin-form" class="signin-form" novalidate>
      <div class="field">
        <label class="label" for="signin-email">Email</label>
        <input id="signin-email" class="input" type="email" name="email"
               autocomplete="email" inputmode="email" required
               placeholder="you@example.com" spellcheck="false">
      </div>
      <button id="signin-btn" class="btn btn-primary btn-block btn-lg" type="submit">
        Send magic link
      </button>
    </form>

    <p id="signin-msg" class="signin-msg" role="status" aria-live="polite"></p>
    <p class="signin-foot">
      No password. A one-time link arrives by email and signs this device in
      until you sign out.
    </p>
  </div>
</main>

<!-- ── app ───────────────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>

  <!-- Desktop: a quiet sidebar. Below 900px this is hidden and the bottom
       bar takes over — two compositions, not one shrunk. -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img class="brand-mark" src="icons/mark.svg" alt="" width="22" height="22">
      <span class="brand-word">Remento</span>
    </div>

    <nav class="nav" id="nav" aria-label="Sections">
      <div class="nav-group">
        <div class="nav-group-label">Study</div>
        <button class="nav-item" data-tab="drill"  aria-current="page">
          <span class="nav-icon" data-icon="drill"></span><span class="nav-label">Drill</span>
        </button>
        <button class="nav-item" data-tab="browse">
          <span class="nav-icon" data-icon="browse"></span><span class="nav-label">Browse</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Manage</div>
        <button class="nav-item" data-tab="import">
          <span class="nav-icon" data-icon="import"></span><span class="nav-label">Import</span>
        </button>
        <button class="nav-item" data-tab="stats">
          <span class="nav-icon" data-icon="stats"></span><span class="nav-label">Stats</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">System</div>
        <button class="nav-item" data-tab="settings">
          <span class="nav-icon" data-icon="settings"></span><span class="nav-label">Settings</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <button class="palette-cue" id="palette-cue" type="button">
        <span class="nav-icon" data-icon="search"></span>
        <span class="nav-label">Search</span>
        <kbd class="kbd">⌘K</kbd>
      </button>
      <label class="edit-toggle">
        <input type="checkbox" id="edit-toggle">
        <span class="edit-toggle-track" aria-hidden="true"></span>
        <span class="edit-toggle-label">Edit mode</span>
      </label>
      <div class="sidebar-user" id="sidebar-user"></div>
    </div>
  </aside>

  <div class="frame">
    <!-- Contextual header. Each view fills the crumb and the actions slot;
         no two screens are forced to carry the same chrome. -->
    <header class="header" id="header">
      <button class="header-menu" id="header-menu" type="button" aria-label="Sections">
        <span class="nav-icon" data-icon="menu"></span>
      </button>
      <nav class="crumb" id="crumb" aria-label="Location"></nav>
      <div class="header-actions" id="header-actions"></div>
    </header>

    <main class="panels" id="main">
      <section class="panel" id="panel-drill"    role="tabpanel" aria-label="Drill"></section>
      <section class="panel" id="panel-subject"  role="tabpanel" aria-label="Subject" hidden></section>
      <section class="panel" id="panel-browse"   role="tabpanel" aria-label="Browse" hidden></section>
      <section class="panel" id="panel-import"   role="tabpanel" aria-label="Import" hidden></section>
      <section class="panel" id="panel-stats"    role="tabpanel" aria-label="Stats" hidden></section>
      <section class="panel" id="panel-settings" role="tabpanel" aria-label="Settings" hidden></section>
    </main>
  </div>

  <!-- Phone: bottom navigation, thumb-reachable, five destinations. -->
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button class="tabbar-btn" data-tab="drill" aria-current="page">
      <span class="nav-icon" data-icon="drill"></span><span>Drill</span>
    </button>
    <button class="tabbar-btn" data-tab="browse">
      <span class="nav-icon" data-icon="browse"></span><span>Browse</span>
    </button>
    <button class="tabbar-btn" data-tab="import">
      <span class="nav-icon" data-icon="import"></span><span>Import</span>
    </button>
    <button class="tabbar-btn" data-tab="stats">
      <span class="nav-icon" data-icon="stats"></span><span>Stats</span>
    </button>
    <button class="tabbar-btn" data-tab="settings">
      <span class="nav-icon" data-icon="settings"></span><span>Settings</span>
    </button>
  </nav>
</div>

<!-- ── overlays ──────────────────────────────────────────────────────────── -->
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal-root" class="modal-root" hidden></div>
<div id="palette-root" class="palette-root" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
